<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Analyst's Desk: Prague Spring 1968</title>
    <style>
        :root {
            --paper: #f4f1ea;
            --ink: #2b2b2b;
            --stamp-red: #8b0000;
            --highlight: #e8dcc4;
            --folder: #d1bfae;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #333;
            color: var(--ink);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #game-container {
            background-color: var(--paper);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #ccc;
            position: relative;
        }
        
        /* Header & Top Bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 { color: var(--stamp-red); margin: 0; font-size: 1.8em; text-transform: uppercase; }
        
        .db-button {
            background-color: var(--ink);
            color: var(--paper);
            border: none;
            padding: 8px 15px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .db-button:hover { background-color: #555; }

        .classified-stamp {
            color: var(--stamp-red);
            border: 3px solid var(--stamp-red);
            padding: 5px 10px;
            display: inline-block;
            font-weight: bold;
            transform: rotate(-5deg);
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 10;
        }
        
        /* Modal / Pop-up Dossier Styles */
        #dossier-modal {
            display: none; /* Hidden by default */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .dossier-content {
            background-color: var(--folder);
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid var(--ink);
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: var(--stamp-red);
            color: white;
            border: none;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
        .bio-card {
            background-color: var(--paper);
            border: 1px solid var(--ink);
            padding: 15px;
            margin-bottom: 20px;
        }
        .bio-card h3 { margin-top: 0; color: var(--stamp-red); border-bottom: 1px dashed var(--ink); }

        /* General Game Styles */
        h2 { text-transform: uppercase; border-bottom: 1px solid var(--ink); }
        .image-placeholder {
            width: 100%; height: 250px;
            background-color: #ddd; border: 2px dashed #999;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px; color: #666; font-style: italic;
            position: relative; overflow: hidden;
        }
        .image-placeholder img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; top: 0; left: 0; z-index: 2;
        }
        .missing-image-text { z-index: 1; }
        .context-box {
            background-color: var(--highlight);
            padding: 15px; margin-bottom: 20px;
            border-left: 4px solid var(--ink);
        }
        .fragment-card {
            border: 1px solid var(--ink);
            padding: 15px; margin-bottom: 15px; background-color: #fff;
        }
        .fragment-text { font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        select { font-family: 'Courier New', Courier, monospace; padding: 5px; font-size: 1em; width: 100%; margin-bottom: 10px; }
        .action-btn {
            background-color: var(--stamp-red); color: var(--paper);
            border: none; padding: 15px 20px; cursor: pointer;
